<div class="ftm-shell">
  <div class="edge-zone" id="edgeZone" aria-label="Open tab manager">
    <div class="edge-line"></div>
  </div>

  <aside class="sidebar" id="sidebar" aria-label="Tab manager">
    <div class="sidebar-row">
      <div class="slider-track" id="sliderTrack" aria-hidden="true">
        <div class="slider-thumb" id="sliderThumb"></div>
      </div>
      <div class="tab-scroll" id="tabScroll" role="tablist" aria-label="Open tabs"></div>
    </div>
    <div class="divider"></div>
    <button class="add-btn" id="addBtn" title="New tab" aria-label="New tab">+</button>
  </aside>
</div>
